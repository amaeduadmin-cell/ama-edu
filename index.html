<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f6b3f" />
<meta name="description" content="AMA EDU is a school management platform for Nigerian schools — students, staff, results, report cards, fees and parents, in one place." />
<title>AMA EDU — School management for Nigerian schools</title>
<link rel="canonical" href="https://amaedu.com.ng/" />
<meta name="robots" content="index, follow" />

<!-- Defaults only. src/lib/seo.js rewrites title, description,
     canonical, Open Graph and JSON-LD as each route renders, and sets
     noindex on every authenticated portal page. -->
<meta property="og:site_name" content="AMA EDU" />
<meta property="og:type" content="website" />
<meta property="og:title" content="AMA EDU — School management for Nigerian schools" />
<meta property="og:description" content="Students, staff, results, report cards, attendance, fees and parents, in one place." />
<meta property="og:url" content="https://amaedu.com.ng/" />
<meta property="og:image" content="https://amaedu.com.ng/og-image.png" />
<meta property="og:locale" content="en_NG" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="AMA EDU — School management for Nigerian schools" />
<meta name="twitter:description" content="Students, staff, results, report cards, attendance, fees and parents, in one place." />
<meta name="twitter:image" content="https://amaedu.com.ng/og-image.png" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "AMA EDU",
  "url": "https://amaedu.com.ng/",
  "logo": "https://amaedu.com.ng/logo.png",
  "description": "School management platform for Nigerian schools.",
  "areaServed": "NG"
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "AMA EDU",
  "url": "https://amaedu.com.ng/",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://amaedu.com.ng/find-school?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" />
</head>
<body>
  <a class="sr-only" href="#app">Skip to main content</a>

  <!-- First paint before JS boots. Replaced by the router. -->
  <div id="app">
    <div style="min-height:60vh;display:grid;place-items:center;padding:24px;">
      <div style="width:100%;max-width:420px;">
        <div class="skeleton skeleton-line" style="width:45%;height:18px;"></div>
        <div class="skeleton skeleton-line" style="width:80%;"></div>
        <div class="skeleton skeleton-line" style="width:65%;"></div>
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding:32px;max-width:520px;margin:0 auto;font-family:system-ui,sans-serif;">
      <h1>JavaScript is required</h1>
      <p>AMA EDU needs JavaScript to load your school portal. Turn it on in your browser settings, then reload this page.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
